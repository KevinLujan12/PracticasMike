<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Internships Portal | Kevin Lujan & Mauricio Prieto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #FAF7F2 0%, #EFE8DE 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
        }

        .dark body {
            background: radial-gradient(circle at center, #121824 0%, #0B0F17 100%);
            color: #F8FAFC;
        }

        .portal-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            padding: 3rem 2.5rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(212, 165, 87, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 90%;
        }

        .dark .portal-card {
            background: rgba(18, 24, 36, 0.85);
            border-color: rgba(212, 165, 87, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(212, 165, 87, 0.2);
            border-top: 4px solid #d97706;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1.5rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="portal-card animate-fade-in">
        <div style="width: 56px; height: 56px; border-radius: 1rem; background: linear-gradient(135deg, #d97706, #b45309); display: flex; align-items: center; justify-content: center; color: white; margin: 0 auto 1.25rem; font-size: 1.5rem; box-shadow: 0 8px 16px rgba(217, 119, 6, 0.25);">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 style="font-family: 'Playfair Display', serif; font-size: 1.75rem; margin-bottom: 0.5rem;">Academic Internships</h1>
        <p style="font-size: 0.875rem; color: #64748B; margin-bottom: 1.5rem;">Verifying security credentials and active session...</p>
        <div class="spinner"></div>
        <p style="font-size: 0.75rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;">OWASP Security Engine</p>
    </div>

    <script>
        // Aplicar tema guardado
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // Validación inicial
        (async function () {
            const token = sessionStorage.getItem('auth_jwt_token') || sessionStorage.getItem('auth_token');
            if (token) {
                const check = await window.Auth.verifyToken(token);
                if (check.valid) {
                    window.location.replace('dashboard.html');
                    return;
                }
            }
            window.location.replace('login.html');
        })();
    </script>
</body>

</html>
